<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 | Aaqib Ansari</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #737373;
        --line: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #010001;
          --fg: #e5e5e5;
          --muted: #a3a3a3;
          --line: #262626;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
        padding: 0 16px;
      }
      main {
        border: 1px solid var(--line);
        padding: 24px;
        max-width: 32rem;
        width: 100%;
        line-height: 1.9;
        font-size: 14px;
      }
      .muted {
        color: var(--muted);
      }
      a {
        color: var(--fg);
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div><span class="muted">$</span> cd <span id="path">this-page</span></div>
      <div class="muted" style="margin-left: 1rem">cd: no such file or directory (404)</div>
      <div><span class="muted">$</span> <a href="/">cd ~</a></div>
    </main>
    <script>
      document.getElementById('path').textContent = location.pathname
    </script>
  </body>
</html>
