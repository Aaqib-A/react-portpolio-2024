    <!-- Same as index.html: light by default; apply a saved dark choice before first paint to avoid a flash. -->
    <script>
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        var theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme === 'dark') {
          root.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d0a14')
        }
      })()
    </script>
